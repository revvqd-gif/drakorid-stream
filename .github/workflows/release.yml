name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: android/*.gradle*

      - name: Read version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set version in build.gradle.kts
        run: |
          ./scripts/set-version.sh "${{ steps.version.outputs.tag }}"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease --no-daemon
        env:
          DRAKORID_KEYSTORE_PATH: ${{ secrets.DRAKORID_KEYSTORE_PATH }}
          DRAKORID_KEYSTORE_PASSWORD: ${{ secrets.DRAKORID_KEYSTORE_PASSWORD }}
          DRAKORID_KEY_ALIAS: ${{ secrets.DRAKORID_KEY_ALIAS }}
          DRAKORID_KEY_PASSWORD: ${{ secrets.DRAKORID_KEY_PASSWORD }}

      - name: Build AAB (Play Store format)
        run: ./gradlew bundleRelease --no-daemon
        env:
          DRAKORID_KEYSTORE_PATH: ${{ secrets.DRAKORID_KEYSTORE_PATH }}
          DRAKORID_KEYSTORE_PASSWORD: ${{ secrets.DRAKORID_KEYSTORE_PASSWORD }}
          DRAKORID_KEY_ALIAS: ${{ secrets.DRAKORID_KEY_ALIAS }}
          DRAKORID_KEY_PASSWORD: ${{ secrets.DRAKORID_KEY_PASSWORD }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Drakorid Stream ${{ steps.version.outputs.tag }}
          generate_release_notes: true |
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/mapping/release/mapping.txt
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
