name: Build APK

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon
        env:
          # No keystore secrets → falls back to debug signing config (see build.gradle.kts)
          DRAKORID_KEYSTORE_PATH: ${{ secrets.DRAKORID_KEYSTORE_PATH }}

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: drakorid-stream-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: drakorid-stream-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Upload mapping
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mapping-release
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 30